services:

  db:
    image: postgres:16
    container_name: quick_commerce_db_prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: quick_commerce_redis_prod
    restart: unless-stopped

  web:
    build: .
    container_name: quick_commerce_web_prod
    restart: unless-stopped
    env_file:
      - .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - staticfiles_prod:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: quick_commerce_celery_worker_prod
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A config worker --loglevel=info
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: quick_commerce_celery_beat_prod
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A config beat --loglevel=info
    volumes:
      - celerybeat_data:/app/celerybeat-data
    depends_on:
      - db
      - redis

volumes:
  postgres_data_prod:
  staticfiles_prod:
  celerybeat_data:

